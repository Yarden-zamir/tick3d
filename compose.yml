# Log limits for tick3d only: Docker keeps at most 3 files of 10 MB per container, and drops the oldest.
# KitSHn recreates the containers on every deploy, so a change here applies at the next deploy.
# The host's Docker and journald settings stay as they are for the other sites. /privacy states this limit.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  site:
    logging: *logging
    build:
      context: .
      target: site
      # The build reads the release name from the commit (Dockerfile). .dockerignore keeps .git out of the main context.
      additional_contexts:
        git: .git
      args:
        KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
    pull_policy: build
    environment:
      KITSHN_RECIPE: ${KITSHN_RECIPE}
      KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
      KITSHN_DEPLOYMENT: ${KITSHN_DEPLOYMENT}
      KITSHN_SOCKET_DIR: ${KITSHN_SOCKET_DIR}
      KITSHN_DEFAULT_SOCKET: ${KITSHN_DEFAULT_SOCKET}
    volumes:
      - ${KITSHN_SOCKET_DIR}:${KITSHN_SOCKET_DIR}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-S", "${KITSHN_DEFAULT_SOCKET}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Online sessions: a Node API with a DuckDB file on the sessions volume. Caddy in `site` proxies /api/* here.
  api:
    logging: *logging
    build:
      context: .
      target: api
      # The build reads the release name from the commit (Dockerfile). .dockerignore keeps .git out of the main context.
      additional_contexts:
        git: .git
      args:
        KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
    pull_policy: build
    # GitHub login. KitSHn passes the repository's KITSHN_GITHUB_CLIENT_ID variable and the
    # KITSHN_GITHUB_CLIENT_SECRET and KITSHN_AUTH_SECRET secrets without their prefix.
    # Without the three, login stays off and the page hides it.
    # Every environment shares the cookie domain, so pull request previews see the production login.
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_ORIGIN: https://tick3d.yarden-zamir.com
      COOKIE_DOMAIN: tick3d.yarden-zamir.com
      # The kitshn button lists the open pull requests of this repository that have a live preview at pr-<n>.<domain>.
      PREVIEWS_REPO: Yarden-zamir/tick3d
      PREVIEWS_DOMAIN: tick3d.yarden-zamir.com
      # prod or pr-<n>. Only prod calls GitHub; every other environment reads the list from production.
      KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
    volumes:
      - sessions:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  sessions:
