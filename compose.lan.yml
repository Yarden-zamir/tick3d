# The whole game on your own computer, for a local network: `docker compose -f compose.lan.yml up --build`.
# Others on the same Wi-Fi then open http://<this computer's address>:8080 and play the Online mode.
# There is no HTTPS here, so a browser gives the page no offline cache and no camera. The game itself works.
# Login is off: GitHub returns only to the public address.
# Log limits for tick3d only: Docker keeps at most 3 files of 10 MB per container, and drops the oldest.
# KitSHn recreates the containers on every deploy, so a change here applies at the next deploy.
# The host's Docker and journald settings stay as they are for the other sites. /privacy states this limit.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  site:
    logging: *logging
    build:
      context: .
      target: site
      # The build reads the release name from the commit (Dockerfile), so this needs a git clone, not a worktree or a zip.
      additional_contexts:
        git: .git
    volumes:
      - ./container/Caddyfile.lan:/etc/caddy/Caddyfile:ro
    ports:
      - "${LAN_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    logging: *logging
    build:
      context: .
      target: api
      # The build reads the release name from the commit (Dockerfile), so this needs a git clone, not a worktree or a zip.
      additional_contexts:
        git: .git
    environment:
      LAN_HOST: "1"
      # The name the page shows ("Hosted on ..."). Set it, or the container's own name shows.
      LAN_HOST_NAME: ${LAN_HOST_NAME:-}
    volumes:
      - lan-sessions:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  lan-sessions:
