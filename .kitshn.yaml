deploy:
  - on: push
    branch: main
    name: prod

  - on: pull_request
    name: pr-{pr}
    ephemeral: true
    # All previews together, and their image builds, each get at most 2 CPUs and 3 GB.
    # The VPS also runs production. Production is never limited.
    limits: { cpus: 2, memory: 3g }
