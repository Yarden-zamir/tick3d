<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Apply the stored theme of the game before the first paint, as index.html does.
      try {
        const theme = JSON.parse(localStorage.getItem('tick3d.settings') ?? 'null')?.theme;
        // Keep this list in step with THEMES in src/protocol.ts.
        const themes = ['light', 'dark', 'snow', 'candy', 'mint', 'retro', 'midnight', 'synthwave', 'bloodmoon', 'coffee', 'batman', 'mono'];
        if (themes.includes(theme)) {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
    <title>tick3d · stats</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="stats">
      <header class="brand stats-head">
        <h1><a href="/" class="home-link">tick<span>3d</span></a> stats</h1>
        <p id="stats-note">Loading…</p>
      </header>
      <div class="stats-grid" id="stats-grid"></div>
    </main>
    <script type="module" src="/src/stats/main.ts"></script>
  </body>
</html>
