<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tick3d store art</title>
    <!--
      The feature graphic and the ads: the "sticker" style that the maintainers picked on pull request 149.
      art.spec.ts opens this page at the output size, with ?tower=<png>. A wide page puts the text left of
      the phone, a tall or square page puts it above. Most lengths use vmin, so one layout fits every size.
    -->
    <style>
      @font-face { font-family: Brand; src: url(../src/fonts/bricolage-grotesque-latin.woff2); font-weight: 200 800; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
      body {
        font-family: Brand, sans-serif;
        background: #e4e7ff radial-gradient(#b9bde6 0.35vmin, transparent 0.35vmin) 0 0 / 4vmin 4vmin;
        display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); padding: 7vmin 7vmin 0;
      }
      .text { position: relative; z-index: 1; }
      .mark { margin: 0; font-size: 15vmin; font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
      .mark span {
        display: inline-block; background: #ff5277; border: 0.9vmin solid #000; border-radius: 2.4vmin;
        padding: 0 0.15em; transform: rotate(-4deg); box-shadow: 1.2vmin 1.2vmin 0 #000;
      }
      p { margin: 3.5vmin 0 0; font-size: 4.6vmin; font-weight: 700; line-height: 1.2; }
      .phones { position: relative; display: flex; align-items: flex-start; justify-content: center; margin-top: 5vmin; }
      .phone {
        width: 46vmin; aspect-ratio: 9 / 16; flex: none; overflow: hidden; background: #000;
        border: 1.6vmin solid #000; border-radius: 6vmin; box-shadow: 2vmin 2vmin 0 #000;
      }
      .phone img { display: block; width: 100%; }

      /*
        Wide: the text on the left, the whole phone on the right. The desktop Play store crops and zooms the
        feature graphic, and Google gives no exact safe area. So the padding keeps all content inside the
        centered 70% × 80% (art.spec.ts checks it), and the edges show only the background.
      */
      @media (min-aspect-ratio: 4 / 3) {
        body {
          grid-template-rows: none; grid-template-columns: auto auto; justify-content: center; align-items: center;
          column-gap: 8vmin; padding: 10vh 15vw;
        }
        .phones { margin: 0; }
        /* The height leaves room for the shadow below the phone. */
        .phone { width: auto; height: calc(80vh - 2vmin); }
        .mark { font-size: 22vmin; }
        p { font-size: 5.6vmin; }
      }

      /* Tall (story): larger text, and the phone fills the extra height. */
      @media (max-aspect-ratio: 2 / 3) {
        body { padding-top: 12vmin; }
        .mark { font-size: 22vmin; }
        p { font-size: 6.6vmin; }
        .phones { margin-top: 10vmin; }
        .phone { width: 66vmin; }
      }
    </style>
  </head>
  <body>
    <div class="text">
      <h1 class="mark">tick<span>3d</span></h1>
      <p>Tic-tac-toe in 3D.<br />Four in a row on a 4×4×4 cube.</p>
    </div>
    <div class="phones">
      <div class="phone"><img id="tower" alt="" /></div>
    </div>
    <script>
      document.getElementById('tower').src = new URLSearchParams(location.search).get('tower') ?? '';
    </script>
  </body>
</html>
