# Weekly update PRs. Minor and patch updates come grouped, so one PR covers most weeks.
# Dependabot PRs get no deploy secrets, so they skip the preview (kitshn.yml) and run the check workflow only.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # The DuckDB client version must match the database file format. Update it on purpose, not weekly.
    ignore:
      - dependency-name: "@duckdb/node-api"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
