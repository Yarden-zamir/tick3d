# Weekly update PRs. Minor and patch updates come grouped, so one PR covers most weeks.
# Dependabot PRs get no deploy secrets: in kitshn.yml they run the check job and skip the preview deploy.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # The DuckDB client version must match the database file format. Update it on purpose, not weekly.
    ignore:
      - dependency-name: "@duckdb/node-api"
      # The e2e workflow runs in the Playwright image with the same version tag. Update both together.
      - dependency-name: "@playwright/test"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # The Android app: the Bubblewrap CLI (android/package.json) and fastlane (android/Gemfile).
  - package-ecosystem: npm
    directory: /android
    schedule:
      interval: weekly
  - package-ecosystem: bundler
    directory: /android
    schedule:
      interval: weekly
    groups:
      fastlane:
        patterns: ['*']
