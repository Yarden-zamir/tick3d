# The type check, the linters, the unit tests and the build, on every pull request.
# The image build runs the same checks before a deploy. This workflow also covers PRs that do not deploy.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
