name: e2e

# Runs the Playwright suite against a pull request preview after the KitSHn deploy succeeds.
# The deploy job sets environment pr-<number> and its URL, so the success status carries the URL.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: The site to test, for example https://pr.17.tick3d.yarden-zamir.com
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'pr-'))
    runs-on: ubuntu-latest
    # The image tag must match the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    concurrency:
      group: e2e-${{ github.event.deployment.environment || inputs.url }}
      cancel-in-progress: true
    env:
      CI: 'true'
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || inputs.url }}
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      # Right after a deploy, the new containers can drop connections for a moment ("socket hang up").
      # The suite starts after the health check answers 5 times in a row, 2 seconds apart.
      - name: Wait for a stable preview
        run: |
          ok=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 "$E2E_BASE_URL/api/health" > /dev/null; then ok=$((ok + 1)); else ok=0; fi
            if [ "$ok" -ge 5 ]; then exit 0; fi
            sleep 2
          done
          echo "The preview at $E2E_BASE_URL did not answer its health check 5 times in a row." >&2
          exit 1
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
