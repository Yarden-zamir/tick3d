# Routes maintainer input to the tick3d agents. See .claude/orchestration/conductor.md.
# - A maintainer's comment on an agent pull request gets a 👀 reaction. The owning agent reads it
#   through its T3 PR watch, so nothing is sent from here.
# - A maintainer's comment on an open issue that agents work on goes to Conductor, then gets a 👀 reaction.
#   Comments on closed issues are skipped. To bring agents back, reopen the issue.
# - The label planned or needs validation, added by a maintainer, goes to Conductor, then gets the Lookout comment.
# The acknowledgement comes after the webhook, so it appears only when Conductor has the event.
# Agents post as tick3d-agents[bot] with the <!-- agent --> marker, so their text never starts a run.
name: Agents

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  route:
    # Every filter is here, so an event that does not matter never starts a runner.
    # A maintainer is anyone with a role on the repository, or a login in the optional
    # AGENT_EXTRA_AUTHORS variable (a JSON list). Adding a label already needs triage access.
    if: >-
      github.event.sender.type != 'Bot'
      && (github.event_name == 'issues'
        || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        || contains(fromJSON(vars.AGENT_EXTRA_AUTHORS || '[]'), github.event.sender.login))
      && !contains(github.event.comment.body, '<!-- agent -->')
      && (
        (github.event_name == 'issues'
          && contains(fromJSON('["planned","needs validation"]'), github.event.label.name))
        || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && contains(github.event.issue.body, '<!-- agent -->'))
        || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
          && github.event.issue.state == 'open'
          && (contains(github.event.issue.labels.*.name, 'planned')
            || contains(github.event.issue.labels.*.name, 'needs validation')
            || contains(github.event.issue.labels.*.name, 'agents: working')
            || contains(github.event.issue.labels.*.name, 'agents: question')))
        || (github.event_name == 'pull_request_review_comment'
          && contains(github.event.pull_request.body, '<!-- agent -->'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Acknowledge and forward
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          WEBHOOK_URL: ${{ secrets.T3_AGENT_WEBHOOK_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          event="$GITHUB_EVENT_PATH"
          repo="$GITHUB_REPOSITORY"

          forward() {
            : "${WEBHOOK_URL:?T3_AGENT_WEBHOOK_URL is not set}"
            : "${CF_ACCESS_CLIENT_ID:?CF_ACCESS_CLIENT_ID is not set}"
            : "${CF_ACCESS_CLIENT_SECRET:?CF_ACCESS_CLIENT_SECRET is not set}"
            local payload
            payload="$(jq -c --arg kind "$1" '{
              kind: $kind,
              repository: .repository.full_name,
              issue: .issue.number,
              title: .issue.title,
              labels: [.issue.labels[].name],
              label: .label.name,
              author: .sender.login,
              body: ((.comment.body // .issue.body // "")[0:4000]),
              url: (.comment.html_url // .issue.html_url)
            }' "$event")"
            # The retries cover a T3 server restart on the VPS, for example a deploy switch.
            curl --fail-with-body --silent --show-error --max-time 30 \
              --retry 12 --retry-delay 15 --retry-max-time 240 --retry-all-errors \
              -X POST "$WEBHOOK_URL" \
              -H "content-type: application/json" \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              --data-binary "$payload"
          }

          case "$GITHUB_EVENT_NAME" in
            issues)
              issue="$(jq -r '.issue.number' "$event")"
              label="$(jq -r '.label.name' "$event")"
              if [[ "$label" == "planned" ]]; then
                text="🛠️ On it. This issue is now **planned**, so agents are spinning up to work on it.

          A draft pull request with a live preview follows soon, and it links back here. Comments on that pull request reach the agents directly."
              else
                text="🔍 Checking it. An agent is spinning up to find out whether this is a real problem, and how big it is.

          The findings follow here. A real problem moves on to a fix. Anything else gets closed with the reason."
              fi
              forward label
              gh api -X POST "repos/$repo/issues/$issue/comments" \
                -f body="<!-- agent -->
          🤖 **Lookout** · GitHub watcher

          $text" >/dev/null
              ;;
            issue_comment)
              if [[ "$(jq -r '.issue.pull_request != null' "$event")" == "false" ]]; then
                forward issue-comment
              fi
              gh api -X POST "repos/$repo/issues/comments/$(jq -r '.comment.id' "$event")/reactions" -f content=eyes >/dev/null
              ;;
            pull_request_review_comment)
              gh api -X POST "repos/$repo/pulls/comments/$(jq -r '.comment.id' "$event")/reactions" -f content=eyes >/dev/null
              ;;
            *)
              echo "Unexpected event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
