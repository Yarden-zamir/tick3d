name: video

# Checks the video code on every pull request that touches it. Renders the 15 s spot (issue #119), every variant
# in both crops, and both tutorials ("How to play" and "Strong cells") at both paces in both crops, by hand, on a push to
# main that touches the video, and on a tag. Pull request previews are rendered on a Mac and published with
# video/scripts/publish.sh, because a CI render round takes about 5 minutes (maintainer decision on #119). A tag
# such as video-v1 also attaches the spot files to a GitHub Release. No secrets.
# A new variant in video/creative/variants/ goes into the matrix below and into publish.sh.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['video/**', 'src/song.ts', 'src/sound.ts', 'src/sound-sets.ts', 'src/style.css', '.github/workflows/video.yml']
    tags: ['video-v*']
  pull_request:
    paths: ['video/**', 'src/song.ts', 'src/sound.ts', 'src/sound-sets.ts', 'src/style.css', '.github/workflows/video.yml']

# contents: write makes the GitHub Release of a tag.
permissions:
  contents: write

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: video/package-lock.json
      # Only video/ needs packages: the game code that it imports from src/ has no dependencies.
      - run: npm ci --no-audit --no-fund
        working-directory: video
      - name: Check beats.json and every variant against the game code
        run: node video/creative/tools/check-beats.ts
      - name: Check the video code
        run: npm run check
        working-directory: video

  render:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [spot, classic]
        crop: [landscape, portrait]
    env:
      VIDEO_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: video/package-lock.json
      # Only video/ needs packages: the game code that it imports from src/ has no dependencies.
      - run: npm ci --no-audit --no-fund
        working-directory: video
      # Remotion downloads Chrome Headless Shell into node_modules/.remotion on the first render.
      - name: Cache Chrome Headless Shell
        uses: actions/cache@v6
        with:
          path: video/node_modules/.remotion
          key: chrome-headless-shell-${{ runner.os }}-${{ hashFiles('video/package-lock.json') }}
      - name: Render ${{ matrix.variant }}, ${{ matrix.crop }}
        working-directory: video
        run: npm run video -- --crop ${{ matrix.crop }}
      # The files of this variant, in one folder for the artifact. ffprobe ships with Remotion.
      - name: Check the length and the size of the MP4
        working-directory: video
        run: |
          case "${{ matrix.crop }}" in landscape) size=1920x1080 ;; portrait) size=1080x1920 ;; esac
          dir=out; [ "${{ matrix.variant }}" = spot ] || dir=out/variants/${{ matrix.variant }}
          mkdir -p render/stills
          cp "$dir"/tick3d-15s-${{ matrix.crop }}.mp4 "$dir"/soundtrack.wav "$dir"/beats.txt render/
          cp "$dir"/stills/${{ matrix.crop }}-bar-*.png render/stills/
          file=render/tick3d-15s-${{ matrix.crop }}.mp4
          got=$(npx remotion ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$file")
          seconds=$(npx remotion ffprobe -v error -show_entries format=duration -of csv=p=0 "$file")
          echo "$file: $got, $seconds s"
          [ "$got" = "$size" ] || { echo "$file is $got, not $size" >&2; exit 1; }
          awk -v s="$seconds" 'BEGIN { exit !(s >= 14.9 && s <= 15.1) }' || { echo "$file lasts $seconds s, not 15.0 s" >&2; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: tick3d-video-${{ matrix.variant }}-${{ matrix.crop }}
          path: video/render/
          if-no-files-found: error

  # The tutorials (video/src/tutorial/), one job per tutorial, pace and crop: the MP4, the soundtrack, one still per
  # section and per checkpoint, and with the landscape crop the web copy for the Info panel. Lengths in seconds:
  # Basics 48 (long) and 34 (short), Strong cells 17 and 12 (video/creative/tutorial.md); the check allows 0.1 s.
  tutorial:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tutorial: [basics, strong]
        pace: [long, short]
        crop: [landscape, portrait]
    env:
      TUTORIAL: ${{ matrix.tutorial }}
      TUTORIAL_PACE: ${{ matrix.pace }}
      # The folder and the file names of a tutorial and pace (NAME in src/tutorial/plan.ts), and its length in seconds.
      CUT: tutorial-${{ matrix.tutorial }}${{ matrix.pace == 'short' && '-short' || '' }}
      SECONDS_WANTED: ${{ fromJSON('{"basics-long":"48.0","basics-short":"34.0","strong-long":"17.0","strong-short":"12.0"}')[format('{0}-{1}', matrix.tutorial, matrix.pace)] }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: video
      - name: Cache Chrome Headless Shell
        uses: actions/cache@v6
        with:
          path: video/node_modules/.remotion
          key: chrome-headless-shell-${{ runner.os }}-${{ hashFiles('video/package-lock.json') }}
      - name: Render the tutorial ${{ matrix.tutorial }}, ${{ matrix.pace }}, ${{ matrix.crop }}
        working-directory: video
        run: npm run tutorial -- --crop ${{ matrix.crop }}
      - name: Check the length and the size of the MP4
        working-directory: video/out/${{ env.CUT }}
        run: |
          case "${{ matrix.crop }}" in landscape) size=1920x1080 ;; portrait) size=1080x1920 ;; esac
          file=tick3d-$CUT-${{ matrix.crop }}.mp4
          got=$(npx remotion ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$file")
          seconds=$(npx remotion ffprobe -v error -show_entries format=duration -of csv=p=0 "$file")
          echo "$file: $got, $seconds s"
          [ "$got" = "$size" ] || { echo "$file is $got, not $size" >&2; exit 1; }
          awk -v s="$seconds" -v w="$SECONDS_WANTED" 'BEGIN { exit !(s >= w - 0.1 && s <= w + 0.1) }' || { echo "$file lasts $seconds s, not $SECONDS_WANTED s" >&2; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: tick3d-${{ env.CUT }}-${{ matrix.crop }}
          path: |
            video/out/${{ env.CUT }}/tick3d-${{ env.CUT }}-${{ matrix.crop }}.mp4
            video/out/${{ env.CUT }}/soundtrack.wav
            video/out/${{ env.CUT }}/stills/${{ matrix.crop }}-*.png
          if-no-files-found: error

  release:
    needs: render
    if: startsWith(github.ref, 'refs/tags/video-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tick3d-video-spot-*
          path: renders
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            renders/*/tick3d-15s-*.mp4
            renders/*/stills/*.png
