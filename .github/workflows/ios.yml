name: ios

# Builds the iOS app: a Capacitor shell that loads the production site, like the Android app (android.yml).
# The page is the same everywhere, so a site deploy reaches the app with no app build. The macOS `app` job
# runs only for a new shell: a tag such as ios-v1.2.0, or by hand. It never runs on a pull request.
# The Xcode project is generated here on every run from apple/capacitor.config.json, so the repository
# adds the committed purchase plugin after generation.
#
# The `lint` job runs on every pull request that touches the iOS shell. It needs no macOS runner, no
# Xcode and no signing: actionlint checks this file's own syntax, and generating the Capacitor project
# with Node alone (no `xcodebuild`, no CocoaPods) catches a bad apple/capacitor.config.json or a broken
# install in well under a minute, so most mistakes surface on the pull request, before the real build.
#
# The `distribute` job runs after a real upload of an ios-v* tag (never after a run by hand or a simulator-only
# build) and needs no Xcode either: it calls the App Store Connect API directly (a JWT signed with the same
# Admin key) to add the new build to the external "Testers" group and submit it for Beta App Review, so every
# tagged release reaches external testers with no manual step in App Store Connect. The group itself, and its
# Beta App Review contact information, are a one-time setup in App Store Connect's TestFlight tab; this job
# never creates or changes either, only looks the group up by name and acts on the build of its own run.
#
# The App Store account is set by repository settings, not by code:
# - variables APPLE_TEAM_ID and IOS_BUNDLE_ID;
# - secrets APP_STORE_CONNECT_KEY (the .p8 text), APP_STORE_CONNECT_KEY_ID and APP_STORE_CONNECT_ISSUER_ID.
#   An Admin key lets Xcode create the certificate and the profile itself (cloud signing), and lets
#   `distribute` call the App Store Connect API directly.
# The secrets have no KITSHN_ prefix: KitSHn forwards every KITSHN_ secret to the server.
# Without them, the job builds for the simulator only, which checks that the project builds.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to TestFlight (needs the App Store Connect key and the variables)
        type: boolean
        default: false
  push:
    tags: ['ios-v*']
  pull_request:
    paths: ['apple/**', '.github/workflows/ios.yml']

# contents: write makes the GitHub release of a tag.
permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap and automatic: runs on every pull request that touches the iOS shell, so a broken config or a
  # workflow mistake shows up on the PR, with no macOS minutes and no simulator or device build.
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apple/package-lock.json

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint .github/workflows/ios.yml

      # The same generation step as the app job, minus Xcode: cap add/sync only write files with Node,
      # so this catches an invalid apple/capacitor.config.json or a package that fails to install.
      - name: Generate the Capacitor iOS project
        working-directory: apple
        run: |
          npm ci --no-audit --no-fund
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          node install-purchase-plugin.mjs
          test -f ios/App/App/Info.plist
          test -f ios/App/App/AppDelegate.swift

  app:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUILD_DIR: ${{ github.workspace }}/build/ios
      SITE_HOST: tick3d.yarden-zamir.com
    # True only once a signed build was actually uploaded (not a simulator build, not a signed export
    # with no upload), so `distribute` runs exactly when there is a new TestFlight build to send out.
    outputs:
      uploaded: ${{ steps.archive.outputs.uploaded }}
      # The build number of this run, so `distribute` sends this build and never an older one.
      code: ${{ steps.version.outputs.code }}
    steps:
      # The tags and their history let android/changelog.sh find the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The App Store takes only builds made with the current Xcode and iOS SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # The version code must grow with every upload: the run number of this workflow does.
      # A tag ios-v1.2.0 names the version 1.2.0. A run by hand gets 0.<run number>.
      - name: Version
        id: version
        run: |
          code=${{ github.run_number }}
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then name="${GITHUB_REF#refs/tags/ios-v}"; else name="0.$code"; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version $name (build $code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Signing
        id: signing
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          if [[ -n "$KEY" && -n "$KEY_ID" && -n "$ISSUER" && -n "$TEAM" && -n "$BUNDLE" ]]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            mkdir -p "$RUNNER_TEMP/keys"
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No App Store Connect key or no APPLE_TEAM_ID / IOS_BUNDLE_ID. The job builds for the simulator only."
          fi
          echo "bundle=${BUNDLE:-com.example.tick3d}" >> "$GITHUB_OUTPUT"

      - name: Generate the Xcode project
        env:
          BUNDLE: ${{ steps.signing.outputs.bundle }}
        run: |
          mkdir -p "$BUILD_DIR"
          cp -R apple/package.json apple/package-lock.json apple/www apple/native apple/install-purchase-plugin.mjs "$BUILD_DIR/"
          jq --arg id "$BUNDLE" '.appId = $id' apple/capacitor.config.json > "$BUILD_DIR/capacitor.config.json"
          cd "$BUILD_DIR"
          npm ci --no-audit --no-fund
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          node install-purchase-plugin.mjs

      # The icon and the launch screen. apple/icon.png (1024 x 1024, no transparency) wins when it exists.
      # Without it, the Play icon is scaled up, which is fine for TestFlight but soft on the App Store.
      - name: Icon and launch screen
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          mkdir -p assets
          if [[ -f "$GITHUB_WORKSPACE/apple/icon.png" ]]; then
            cp "$GITHUB_WORKSPACE/apple/icon.png" assets/icon-only.png
          else
            echo "::warning::No apple/icon.png. The 512 px Play icon is scaled up to 1024 px."
            sips --resampleHeightWidth 1024 1024 "$GITHUB_WORKSPACE/android/store/en-US/images/icon.png" --out assets/icon-only.png
          fi
          cp assets/icon-only.png assets/logo.png
          npx capacitor-assets generate --ios --assetPath assets \
            --iconBackgroundColor '#e4e7ff' --splashBackgroundColor '#e4e7ff' --splashBackgroundColorDark '#e4e7ff'

      # The app-bound domain lets the web view run the site's service worker, so the game plays offline.
      # The usage texts are for voice play, QR scanning and WebRTC on the local network.
      - name: Info.plist
        working-directory: ${{ env.BUILD_DIR }}/ios/App/App
        run: |
          plist=Info.plist
          pb() { /usr/libexec/PlistBuddy -c "$1" "$plist"; }
          pb "Delete :WKAppBoundDomains" 2>/dev/null || true
          pb "Add :WKAppBoundDomains array"
          pb "Add :WKAppBoundDomains:0 string $SITE_HOST"
          pb "Add :NSMicrophoneUsageDescription string tick3d uses the microphone only for voice play or when you choose to receive a Wi-Fi reply by sound. Audio stays on your device."
          pb "Add :NSCameraUsageDescription string tick3d uses the camera only when you scan a code to join a Wi-Fi game. Camera images stay on your device."
          pb "Add :NSLocalNetworkUsageDescription string tick3d connects to devices on your network for Wi-Fi games."
          pb "Add :ITSAppUsesNonExemptEncryption bool false"
          pb "Set :CFBundleDisplayName tick3d"
          plutil -lint "$plist"

      - name: Build for the simulator
        if: steps.signing.outputs.sign != 'true'
        working-directory: ${{ env.BUILD_DIR }}/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 40

      # Xcode signs with the App Store Connect key (cloud signing) and uploads to TestFlight at export.
      - name: Archive and upload
        id: archive
        if: steps.signing.outputs.sign == 'true'
        working-directory: ${{ env.BUILD_DIR }}/ios/App
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          UPLOAD: ${{ startsWith(github.ref, 'refs/tags/ios-v') || inputs.upload }}
        run: |
          # Without pipefail, `| tail` hides a failed archive or upload, and `distribute` then sends nothing new.
          set -o pipefail
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          # iPhone only (TARGETED_DEVICE_FAMILY 1): the iPad layout is not tested yet.
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$BUILD_DIR/tick3d.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic TARGETED_DEVICE_FAMILY=1 \
            MARKETING_VERSION='${{ steps.version.outputs.name }}' CURRENT_PROJECT_VERSION='${{ steps.version.outputs.code }}' \
            "${auth[@]}" archive | tail -n 40
          destination="export"
          [[ "$UPLOAD" == true ]] && destination="upload"
          plutil -create xml1 "$BUILD_DIR/export.plist"
          plutil -insert method -string app-store-connect "$BUILD_DIR/export.plist"
          plutil -insert destination -string "$destination" "$BUILD_DIR/export.plist"
          plutil -insert teamID -string "$TEAM" "$BUILD_DIR/export.plist"
          plutil -insert signingStyle -string automatic "$BUILD_DIR/export.plist"
          plutil -insert manageAppVersionAndBuildNumber -bool false "$BUILD_DIR/export.plist"
          xcodebuild -exportArchive -archivePath "$BUILD_DIR/tick3d.xcarchive" \
            -exportOptionsPlist "$BUILD_DIR/export.plist" -exportPath "$BUILD_DIR/export" "${auth[@]}" | tail -n 40
          echo "Export: $destination" >> "$GITHUB_STEP_SUMMARY"
          echo "uploaded=$([[ "$destination" == upload ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      # A tag ios-v1.2.0 makes a GitHub release with the changelog since the previous ios-v tag.
      - name: Release text
        id: release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        run: |
          body="$RUNNER_TEMP/release.md"
          {
            echo "The iOS app ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }}), uploaded to TestFlight."
            echo
            android/changelog.sh 'ios-v*'
          } > "$body"
          echo "body=$body" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: iOS ${{ steps.version.outputs.name }}
          body_path: ${{ steps.release.outputs.body }}
          make_latest: false

  # Sends each tagged TestFlight upload to external testers automatically: no Xcode here, only the App Store
  # Connect API (apple/scripts/testflight-distribute.py). Runs only after `app` actually uploaded the build
  # of an ios-v* tag. A run by hand with "upload" only uploads to TestFlight.
  distribute:
    needs: app
    if: needs.app.outputs.uploaded == 'true' && startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: ubuntu-latest
    # The script waits up to POLL_DEADLINE_MIN (40) for Apple's processing of the build, then fails.
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Add the build to the external testing group and submit it for review
        env:
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          BUNDLE: ${{ vars.IOS_BUNDLE_ID }}
          BUILD_NUMBER: ${{ needs.app.outputs.code }}
        run: uv run apple/scripts/testflight-distribute.py
