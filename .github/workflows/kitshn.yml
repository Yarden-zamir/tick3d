on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      environment: { required: true, type: string }
      ref: { required: false, type: string }

permissions:
  contents: read
  deployments: write

jobs:
  # The type check, the linters, the unit tests and the build, in about half a minute.
  # A push to a branch other than main deploys nothing, and a closed PR only tears down, so both skip it.
  check:
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Production and manual deploys wait for a passing check.
  deploy:
    needs: check
    if: >-
      always() && needs.check.result == 'success' &&
      github.event_name != 'pull_request'
    uses: Yarden-zamir/kitshn/.github/workflows/deploy.yml@main
    secrets: inherit

  # A PR preview (and its teardown) starts at once, next to the check, so it is ready sooner.
  # A failing check still marks the PR red. Pushes to other branches deploy nothing (kitshn resolves that).
  # Dependabot runs get no deploy secrets, so they skip the preview.
  preview:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main'))
    uses: Yarden-zamir/kitshn/.github/workflows/deploy.yml@main
    secrets: inherit
