on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # kitshn 2 agent keys start a build of one branch (K-718); the dispatch has no inputs.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # The type check, the linters, the unit tests and the build, in about half a minute.
  # A push to a branch other than main deploys nothing, and a closed PR only tears down, so both skip it.
  check:
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Production and manual deploys wait for a passing check.
  deploy:
    needs: check
    if: >-
      always() && needs.check.result == 'success' &&
      github.event_name != 'pull_request'
    uses: Yarden-zamir/kitshn/.github/workflows/kitshn2-deploy.yml@main
    secrets: inherit

  # A PR preview (and its teardown) starts at once, next to the check, so it is ready sooner.
  # A failing check still marks the PR red. A push to a branch other than main runs no deploy job: kitshn 2 would
  # deploy nothing for it.
  # Dependabot runs get no deploy secrets, so they skip the preview.
  # An open PR with the label no-preview builds no preview. Its close still runs the teardown. A preview that
  # exists before the label stays until the PR closes: kitshn tears down only on close.
  preview:
    if: >-
      github.actor != 'dependabot[bot]' &&
      !(github.event_name == 'pull_request' && github.event.action != 'closed' && contains(github.event.pull_request.labels.*.name, 'no-preview')) &&
      github.event_name == 'pull_request'
    uses: Yarden-zamir/kitshn/.github/workflows/kitshn2-deploy.yml@main
    secrets: inherit
