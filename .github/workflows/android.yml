name: android

# Builds the committed Android project. It runs by hand or on an android-v tag.
# A tag or a run by hand uploads to closed testing (alpha) with release notes (android/release-notes.sh).
# Every build makes a GitHub release with the bundle. Promotion to other tracks: play-promote.yml.
#
# The secrets have no KITSHN_ prefix: KitSHn forwards every KITSHN_ secret to the server, and the
# signing key must never go there. They are plain repository secrets.
# Without the upload key the job builds an unsigned bundle. Without the service account it uploads nothing.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track for the upload (only with signing and PLAY_SERVICE_ACCOUNT_JSON)
        type: choice
        options: [alpha, internal, none]
        default: alpha
  push:
    tags: ['android-v*']

# contents: write makes the GitHub release of a tag. pull-requests: read lists the release notes.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_DIR: ${{ github.workspace }}/android
    steps:
      # The tags and their history let android/release-notes.sh find the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Bubblewrap 1.25 generates a project for Android Gradle Plugin 8.9, which runs on JDK 17.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The template targets API 36 (Android 16). Bubblewrap 1.25 signs with build-tools 36.1.0.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'

      # The version code must grow with every upload: the run number of this workflow does.
      # A tag android-v1.2.0 names the version 1.2.0. A run by hand gets 0.<run number>.
      - name: Version
        id: version
        run: |
          code=${{ github.run_number }}
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then name="${GITHUB_REF#refs/tags/android-v}"; else name="0.$code"; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "package=$(jq --exit-status --raw-output .packageId android/twa-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version $name (code $code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEY_ALIAS" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" ]]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No upload key (ANDROID_UPLOAD_* secrets). The bundle is unsigned, and Play does not take it."
          fi

      - name: Build
        working-directory: ${{ env.BUILD_DIR }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ '${{ steps.signing.outputs.sign }}' == true ]]; then
            base64 --decode <<< "$KEYSTORE_B64" > upload.keystore
            trap 'rm -f upload.keystore' EXIT
            ./gradlew bundleRelease assembleRelease -PversionCode='${{ steps.version.outputs.code }}' -PversionName='${{ steps.version.outputs.name }}'
            cp app/build/outputs/bundle/release/app-release.aab tick3d.aab
            cp app/build/outputs/apk/release/app-release.apk tick3d.apk
          else
            unset KEYSTORE_B64
            ./gradlew bundleRelease assembleRelease -PversionCode='${{ steps.version.outputs.code }}' -PversionName='${{ steps.version.outputs.name }}'
            cp app/build/outputs/bundle/release/app-release.aab tick3d-unsigned.aab
            cp app/build/outputs/apk/release/app-release-unsigned.apk tick3d-unsigned.apk
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: tick3d-android-${{ steps.version.outputs.name }}
          path: |
            ${{ env.BUILD_DIR }}/tick3d*.aab
            ${{ env.BUILD_DIR }}/tick3d*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.track != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(android/release-notes.sh "${{ github.ref_name }}")
          printf '%s\n' "$notes" | tee "$RUNNER_TEMP/release-notes.txt" >> "$GITHUB_STEP_SUMMARY"
          # fastlane supply reads the notes of a version code from a metadata folder. It reads every
          # folder there as a language, so the notes get their own folder with only en-US in it.
          mkdir -p "$RUNNER_TEMP/store/en-US/changelogs"
          cp "$RUNNER_TEMP/release-notes.txt" "$RUNNER_TEMP/store/en-US/changelogs/${{ steps.version.outputs.code }}.txt"

      - name: Play API
        id: play
        if: steps.signing.outputs.sign == 'true' && (startsWith(github.ref, 'refs/tags/android-v') || inputs.track != 'none')
        uses: ./.github/actions/play-api
        with:
          service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - uses: ruby/setup-ruby@v1.329.0
        if: steps.play.outputs.ready == 'true'
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: android

      # The testers are on closed testing (alpha), so a tag uploads there. The release is completed, so
      # Play sends it to review and then to the testers without a step in Play Console.
      - name: Upload to Google Play
        if: steps.play.outputs.ready == 'true'
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle exec fastlane supply \
            --package_name '${{ steps.play.outputs.package }}' \
            --aab "$BUILD_DIR/tick3d.aab" \
            --track '${{ inputs.track || 'alpha' }}' \
            --release_status completed \
            --metadata_path "$RUNNER_TEMP/store" \
            --skip_upload_apk true --skip_upload_metadata true --skip_upload_images true --skip_upload_screenshots true

      - name: No Play upload
        if: steps.play.outputs.ready != 'true'
        run: |
          echo "::notice::No Play upload. It needs a tag or a track, the upload key (ANDROID_UPLOAD_*), PLAY_SERVICE_ACCOUNT_JSON, and the app in Play."

      # Every build makes a GitHub release with the bundle. A tag android-v1.2.0 makes a normal release.
      # A run by hand makes a pre-release on a new tag android-0.<run number>, at the built commit.
      # The changelog lists the commits since the previous release tag (android/changelog.sh).
      - name: Release text
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            tag=$GITHUB_REF_NAME; pattern='android-v*'; prerelease=false
          else
            tag="android-${{ steps.version.outputs.name }}"; pattern='android-*'; prerelease=true
          fi
          if [[ '${{ steps.signing.outputs.sign }}' == true ]]; then signing=signed; else signing=unsigned; fi
          body="$RUNNER_TEMP/release.md"
          {
            echo "Version ${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }}), **${signing}**."
            if [[ "$signing" == unsigned ]]; then echo "Play does not take an unsigned bundle. It installs only for tests."; fi
            echo
            android/changelog.sh "$pattern"
          } > "$body"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "title=tick3d ${{ steps.version.outputs.name }} for Android (${signing})" >> "$GITHUB_OUTPUT"
          echo "body=$body" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.title }}
          body_path: ${{ steps.release.outputs.body }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: true
          files: |
            ${{ env.BUILD_DIR }}/tick3d*.aab
            ${{ env.BUILD_DIR }}/tick3d*.apk
